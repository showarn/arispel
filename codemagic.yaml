workflows:
  unity-android-development:
    name: Arisspel Android development
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      unity: 6000.4.5f1
      groups:
        - unity_credentials
      vars:
        UNITY_PROJECT_PATH: .
    cache:
      cache_paths:
        - $CM_BUILD_DIR/Library
    scripts:
      - name: Activate Unity license
        script: |
          "$UNITY_HOME/Contents/MacOS/Unity" \
            -batchmode \
            -quit \
            -logFile - \
            -serial "$UNITY_SERIAL" \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD"

      - name: Run EditMode tests
        script: |
          "$UNITY_HOME/Contents/MacOS/Unity" \
            -batchmode \
            -nographics \
            -projectPath "$UNITY_PROJECT_PATH" \
            -runTests \
            -testPlatform EditMode \
            -testResults "$CM_BUILD_DIR/editmode-results.xml" \
            -logFile -

      - name: Run PlayMode tests
        script: |
          "$UNITY_HOME/Contents/MacOS/Unity" \
            -batchmode \
            -nographics \
            -projectPath "$UNITY_PROJECT_PATH" \
            -runTests \
            -testPlatform PlayMode \
            -testResults "$CM_BUILD_DIR/playmode-results.xml" \
            -logFile -

      - name: Build Android development APK
        script: |
          "$UNITY_HOME/Contents/MacOS/Unity" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$UNITY_PROJECT_PATH" \
            -executeMethod ArisMonsterTrucks.Editor.ProjectBuilder.BuildAndroidDevelopment \
            -logFile -

    artifacts:
      - Builds/Android/*.apk
      - editmode-results.xml
      - playmode-results.xml

    publishing:
      scripts:
        - name: Deactivate Unity license
          script: |
            "$UNITY_HOME/Contents/MacOS/Unity" \
              -batchmode \
              -quit \
              -logFile - \
              -returnlicense \
              -username "$UNITY_EMAIL" \
              -password "$UNITY_PASSWORD"
