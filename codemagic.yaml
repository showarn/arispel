workflows:
  ios-testflight:
    name: Arisspel iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Arisspel Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: se.arisfamiljespel.arisspel
      vars:
        XCODE_PROJECT: iOS/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
    scripts:
      - name: Download exported Xcode project
        script: |
          curl --fail --location \
            --output /tmp/arisspel-ios-xcode.zip \
            https://github.com/showarn/arispel/releases/download/ios-export-0.6.0/arisspel-ios-xcode.zip
          unzip -q /tmp/arisspel-ios-xcode.zip -d "$CM_BUILD_DIR"

      - name: Set build number and encryption declaration
        script: |
          cd iOS
          agvtool new-version -all "$BUILD_NUMBER"
          /usr/libexec/PlistBuddy \
            -c "Add :ITSAppUsesNonExemptEncryption bool false" \
            Info.plist || \
          /usr/libexec/PlistBuddy \
            -c "Set :ITSAppUsesNonExemptEncryption false" \
            Info.plist

      - name: Use App Store signing profiles
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: >
          xcode-project build-ipa
          --project "$XCODE_PROJECT"
          --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
